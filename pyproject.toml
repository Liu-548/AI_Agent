[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: test cần gọi mạng thật (arXiv/Wikipedia). Bỏ qua bằng: pytest -m 'not network'",
]
# Tắt ĐÚNG hai cảnh báo đã biết, để cảnh báo thật không bị chìm trong 14 dòng nhiễu.
# Cả hai đều vô hại và nằm ngoài tầm sửa của nhóm:
#  - create_react_agent: chính langgraph-supervisor bên trong cũng còn gọi hàm này;
#  - langchain-community: gói đang bị khai tử, ta chỉ dùng ArxivAPIWrapper/WikipediaAPIWrapper.
# Xem QUY_TAC_THIET_KE.md, Bảng 11. Mọi cảnh báo khác vẫn hiện bình thường.
filterwarnings = [
    "default",
    "ignore:create_react_agent has been moved:",
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
